
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | RealEstate Hub</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-brand">
        <h1>RealEstate Hub</h1>
        <p>Your property journey starts here.</p>
    </div>

    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="subtitle">Join our real estate platform</p>

        <form id="signupForm">

            <label for="signupName">Full Name</label>
            <input type="text" id="signupName"
                   placeholder="Enter your name" required>

            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail"
                   placeholder="Enter your email" required>

            <label for="signupPhone">Phone Number</label>
            <input type="tel" id="signupPhone"
                   placeholder="Enter phone number" required>

            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword"
                   placeholder="Create a password"
                   minlength="8" required>

            <label for="signupRole">I want to</label>
            <select id="signupRole" required>
                <option value="">Select your role</option>
                <option value="BUYER">Buy or Rent Properties</option>
                <option value="SELLER">Sell or List Properties</option>
            </select>

            <button type="submit">Create Account</button>
        </form>

        <p id="signupMessage" class="message" role="status"></p>

        <p class="auth-footer">
            Already have an account?
            <a href="login.html">Sign In</a>
        </p>
    </div>

</div>

<script src="auth.js"></script>
</body>
</html>
